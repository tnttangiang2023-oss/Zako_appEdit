<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Style Web Editor - Preset Pack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body class="bg-[#121212] text-gray-200 h-screen flex flex-col overflow-hidden font-sans select-none">

    <header class="h-14 bg-[#181818] border-b border-gray-800 flex items-center justify-between px-4">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-2 rounded-lg text-white font-bold text-sm shadow-md">
                <i class="fa-solid fa-clapperboard"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white tracking-wide">EDITS PRESET PACK EDITOR</h1>
                <p class="text-[10px] text-gray-400">Dựa theo Preset Pack của @za.warudoed1t</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="alert('Đã lưu bản nháp thành công!')" class="bg-[#222] hover:bg-[#2c2c2c] border border-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk text-gray-400"></i> Lưu dự án
            </button>
            <button onclick="alert('Đang tiến hành xuất video chất lượng cao...')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-file-export"></i> Xuất Video (Export)
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-[#161616] border-r border-gray-800 flex flex-col">
            <div class="flex border-b border-gray-800 bg-[#111] text-xs font-semibold">
                <button onclick="switchTab('media')" id="btn-media" class="flex-1 py-3 text-blue-400 border-b-2 border-blue-500 transition">Media & Audio</button>
                <button onclick="switchTab('effects')" id="btn-effects" class="flex-1 py-3 text-gray-400 hover:text-white transition">Hiệu Ứng Pack</button>
            </div>

            <div id="tab-media" class="p-4 flex-1 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">1. Thêm Ảnh / Video</label>
                    <label class="border-2 border-dashed border-gray-700 hover:border-blue-500 rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer bg-[#1c1c1c] transition group">
                        <i class="fa-solid fa-photo-film text-2xl text-gray-400 group-hover:text-blue-400 mb-1"></i>
                        <span class="text-xs font-medium text-gray-300">Tải lên Ảnh / Video</span>
                        <input type="file" id="mediaInput" accept="video/*,image/*" class="hidden" onchange="handleMediaUpload(event)">
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">2. Thêm Nhạc (Trích xuất từ Video / Audio)</label>
                    <label class="border-2 border-dashed border-gray-700 hover:border-purple-500 rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer bg-[#1c1c1c] transition group">
                        <i class="fa-solid fa-file-audio text-2xl text-gray-400 group-hover:text-purple-400 mb-1"></i>
                        <span class="text-xs font-medium text-gray-300">Chọn video lấy tiếng / File nhạc</span>
                        <input type="file" id="audioInput" accept="audio/*,video/*" class="hidden" onchange="handleAudioUpload(event)">
                    </label>
                </div>

                <div>
                    <span class="text-xs font-semibold text-gray-400 uppercase">Tài nguyên đã thêm:</span>
                    <div id="resourceList" class="mt-2 space-y-1.5">
                        <p class="text-[11px] text-gray-600 italic">Chưa có tệp nào được thêm vào...</p>
                    </div>
                </div>
            </div>

            <div id="tab-effects" class="p-4 flex-1 overflow-y-auto space-y-4 hidden">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Shake (Hiệu ứng rung lắc)</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyEffect('XeFew Shakes')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-blue-500 text-left transition">
                            <span class="text-xs font-bold block text-blue-400">XeFew Shakes</span>
                            <span class="text-[10px] text-gray-500">Rung mạnh bắt nhịp</span>
                        </button>
                        <button onclick="applyEffect('Hypic Shake')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-blue-500 text-left transition">
                            <span class="text-xs font-bold block text-blue-400">Hypic Shake</span>
                            <span class="text-[10px] text-gray-500">Rung mượt chuẩn preset</span>
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Transition & Ghost</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyEffect('Transition')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-purple-500 text-left transition">
                            <span class="text-xs font-bold block text-purple-400">Transition</span>
                            <span class="text-[10px] text-gray-500">Chuyển cảnh mượt</span>
                        </button>
                        <button onclick="applyEffect('Ghost Effect')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-purple-500 text-left transition">
                            <span class="text-xs font-bold block text-purple-400">Ghost</span>
                            <span class="text-[10px] text-gray-500">Hiệu ứng bóng mờ</span>
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Arrows & Slide/Rotation</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyEffect('Arrows')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-yellow-500 text-left transition">
                            <span class="text-xs font-bold block text-yellow-400">Arrows</span>
                            <span class="text-[10px] text-gray-500">Mũi tên chỉ hướng</span>
                        </button>
                        <button onclick="applyEffect('Slide & Rotation')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-yellow-500 text-left transition">
                            <span class="text-xs font-bold block text-yellow-400">Slide & Rotation</span>
                            <span class="text-[10px] text-gray-500">Trượt và xoay góc</span>
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Graphs & Aura</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyEffect('Graphs Easing')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-red-500 text-left transition">
                            <span class="text-xs font-bold block text-red-400">Graphs</span>
                            <span class="text-[10px] text-gray-500">Biểu đồ tốc độ</span>
                        </button>
                        <button onclick="applyEffect('Aura Effect')" class="bg-[#1f1f1f] hover:bg-[#282828] p-2.5 rounded-lg border border-gray-800 hover:border-red-500 text-left transition">
                            <span class="text-xs font-bold block text-red-400">Aura</span>
                            <span class="text-[10px] text-gray-500">Hào quang phát
